в зачет и не учитываются в счетчике зрителей."}},"@streams/desktop/components.RatingProgram.RulesTerms":{"title":"Термины","metricDescription":{"days_on_air":{"header":"Количество дней в течение сезона, в которые была проведена трансляция.","rules":{"0":"День трансляции засчитывается, если суммарная длительность трансляций, начатых в этот день, была не менее 2 часов.","1":"Отсчет дня в течение сезона начинается в 03:00 по московскому времени и заканчивается через 24 часа."}},"raid_members":{"header":"Сумма всех зрителей, отправленных Стримером рейдами с использованием функционала Сервиса на другие каналы в течение сезона.","rules":{"0":"В один день засчитывается только один рейд с максимальным количеством «Рейдеров»","1":"Отсчет дня в течение сезона начинается в 03:00 по московскому времени и заканчивается через 24 часа."}},"view_time":{"header":"Сумма минут, в течение которых каждый из зрителей смотрел Трансляцию.","rules":{"0":"В показатель учитывается только время просмотра тех зрителей, которые смотрели трансляцию больше 1 секунды","1":"Например, 10 зрителей, просмотревших Трансляцию по 6 секунд, добавляют 1 минуту в показатель «Минут просмотра»."}},"total_profit":{"lines":{"0":"Максимальная общая сумма платных подписок &lt;BoostyLink&gt;Boosty.to&lt;/BoostyLink&gt; в отношении канала стримера на {{projectName}} в течение сезона.","1":"Рассчитывается как сумма «Стоимостей» всех активных подписок в конкретный день.","2":"&lt;Br&gt; &lt;/Br&gt;","3":"Что влияет на метрику:","4":"&lt;Li&gt;новая подписка от нового подписчика (добавит стоимость этой подписки только за 1 месяц, вне зависимости от срока подписки)&lt;/Li&gt;","5":"&lt;Li&gt;повышение уровня подписки текущего подписчика (заменит стоимость текущей подписки)&lt;/Li&gt;","6":"&lt;Li&gt;принятая получателем подарочная подписка (добавит стоимость за 1 месяц, вне зависимости от срока подписки)&lt;/Li&gt;","7":"&lt;Br&gt; &lt;/Br&gt;","8":"Что не влияет на метрику:","9":"&lt;Li&gt;плановое продление существующей подписки (общая стоимость купленных подписок от этого не меняется)&lt;/Li&gt;","10":"&lt;Li&gt;понижение уровня подписки (зачтется только после окончания срока текущего уровня)&lt;/Li&gt;","11":"&lt;Li&gt;купленная подарочная подписка (зачтется только после принятия получателем)&lt;/Li&gt;","12":"&lt;Li&gt;донаты&lt;/Li&gt;"}},"cp_reward_activate":{"lines":{"0":"Количество баллов, потраченных зрителями Трансляций Стримера на «награды» канала такого Стримера через функционал Платформы в течение Сезона.","1":"Запросы наград должны быть выполнены стримером."}},"like":"Суммарное количество сердец, поставленных на Трансляциях.","verification":{"lines":{"0":"&lt;Li&gt;Впервые получить галку верификации можно, достигнув 3 уровня и выше в Стримерском сезоне.&lt;/Li&gt;","1":"&lt;Li&gt;Достигнув 3 уровня и выше, Стример получает право подать заявку на верификацию канала и, при одобрении, получить галку соответствующего уровня.&lt;/Li&gt;","2":"&lt;Br&gt; &lt;/Br&gt;","3":"Обновление Галок:","4":"&lt;Li&gt;Если стример уже верифицирован, в последующих Стримерских сезонах цвет галки будет изменяться в зависимости от достигнутого уровня в последнем сезоне.&lt;/Li&gt;","5":"&lt;Br&gt; &lt;/Br&gt;","6":"Преимущества:","7":"&lt;Li&gt;Отображение у канала галки верификации соответствующего уровня.&lt;/Li&gt;","8":"&lt;Li&gt;Возможность размещения канала в Карусели на главной странице {{projectName}}. Чем выше текущий уровень, тем чаще канал будет размещаться в Карусели.&lt;/Li&gt;"}}}},"@streams/desktop/components.RatingProgram.SeasonInfo":{"rules":"Правила участия"},"@streams/desktop/components.RatingProgram.SeasonLevelBadge":{"verifiedChannelLevel":{"0":"Верифицированный канал | Уровень 1","1":"Верифицированный канал | Уровень 2","2":"Верифицированный канал | Уровень 3","3":"Верифицированный канал | Уровень 4","4":"Верифицированный канал | Уровень 5","5":"Верифицированный канал | Уровень 6"},"access":"(Доступно только для уже верифицированных каналов)"},"@streams/desktop/compo туру **записи трансляций будет временно недоступна**.\n\nОстальные возможности платформы — проведение прямых эфиров, просмотр, взаимодействие со зрителями — доступны в полном объеме.\n\nСпасибо за  понимание и извините за доставленные неудобства","imageUrl":"https://images.live.vkvideo.ru/image/ff254264-5212-4bc4-bd85-9dfbc023984f?change_time=1774868420","publicationDate":"1774875810"},{"id":"153","title":"Подключайся к просмотру решающих матчей Astrum Лиги 🔥 ","releaseDate":"1773392435","isImportant":true,"description":"С 13 по 15 марта 8 лучших команд сражаются за 10 000 000 ₽ и звание сильнейших в Warface. Поддерживай своих фаворитов и получай редкие внутриигровые награды. \n\n🎁 За каждые 30 минут просмотра — кейс \"Игры Ростелеком x Astrum Лига\". \n\nСмотри трансляцию [на канале Warface](https://live.vkvideo.ru/ruwarface) и получай гарантированные призы!\n","imageUrl":"https://images.live.vkvideo.ru/image/c9c36e03-0507-4983-9197-14a86ae8986a?change_time=1773237638","publicationDate":"1773392459"},{"id":"152","title":"LANGAME Challenge по CS2","releaseDate":"1771768572","isImportant":true,"description":"💣 Прямо сейчас идут полуфиналы плей-офф стадии 2 сезона **[LANGAME Challenge по CS2](https://live.vkvideo.ru/langameru)**. В суровых противостояниях сойдутся обычные ребята из компьютерных клубов со всей страны! 12 команд прошли жесткий отбор и продолжают борьбу за 1.14 млн рублей призовых!\n \n🔥 Вас ждут крутые хайлайты, яркие эмоции комментаторов. И, конечно, призы. Копите баллы канала и меняйте их на различные плюшки. А, чуть не забыли, в финале турнира зрителей ждет суперприз — комплект из ножа и перчаток за 20 000 рублей! Его, кстати, может выиграть каждый.\n\n🤜🤛 Готовы к эпичным зарубам? Тогда залетайте на трансляцию! \nА чтобы ничего не пропустить и всегда быть в курсе событий, подписывайтесь на паблик LANGAME в VK.\n\nGo, go, go 👇\n\nhttps://live.vkvideo.ru/langameru \n","imageUrl":"https://images.live.vkvideo.ru/image/720dbb79-914c-47c4-a82f-3ec12c2b0ae3?change_time=1771768727","publicationDate":"1771768576"},{"id":"151","title":"Теперь у нас есть кланы ","releaseDate":"1766509865","isImportant":true,"description":"Уже заметили? Обновление на платформе 😳\n\n🎁 Теперь у нас есть кланы (объединения стримеров)! Разбираем подробнее 💘\n\n🟣 Новый раздел «Кланы» отображается на главной странице — там можно увидеть общий онлайн клана и количество подписчиков. \n\n🟣 Создавать кланы могут только верифицированные стримеры (те, у кого есть галочки). \n\n🟣 У всех кланов есть свой «флаг» (как обложка у категории); его загружает создатель клана. \n\n🟣 Есть система «прокачки» кланов — она зависит от уровней, которые занимают стримеры-участники клана. \n\n🟣 Чем выше уровень клана, тем больше людей в него могут вступить.\n\n🔹 Где создать?\nУправление каналом → Клан \n \n**До встречи в кланах VK Видео Live**","imageUrl":"https://images.live.vkvideo.ru/image/34d489e0-ba96-49e0-a4dc-469ac88fcbaa?change_time=1766531519","publicationDate":"1766531491"},{"id":"150","title":"Плей-офф турнира BLAST Rivals","releaseDate":"1763120028","isImportant":true,"description":"**Любителям киберспорта на этой неделе повезло 🎮**\n\nСледим за стадией плей-офф турнира **BLAST Rivals** по CS2! \n\n**С 14 по 16 ноября** двигайтесь к решающей развязке вместе с топовыми командами 🔥\n\nКто докажет своё превосходство в CS2 — узнаем совсем скоро…","imageUrl":"https://images.live.vkvideo.ru/image/5bbf57a1-51c3-437e-bcee-1095df91ddc5?change_time=1763120181","publicationDate":"1763120078"},{"id":"149","title":"Режим предпросмотра","releaseDate":"1762534767","isImportant":true,"description":"👏 **Кое-что новенькое на платформе!**\n\n🟣 Режим предпросмотра трансляции:\n- возможность проверить, как всё выглядит перед стартом;\n- доступно для всех модераторов канала;\n- режим можно включить или выключить в Студии. \n\n🟣 Кнопка «Остановить эфир» для всех трансляций:\n- возможность остановить трансляцию не через OBS, а напрямую из Студии.  \n\n **Важно:** фрагменты трансляции в режиме предпросмотра и после нажатия на кнопку остановки эфира на платформе не попадают в запись. В записи будет только то, что было до нажатия кнопки остановки, даже если в OBS трансляция ещё идет. \n\nПользуйтесь и увидимся в Live 🫶","imageUrl":"https://images.live.vkvideo.ru/image/399ef6c7-db52-4f02-a4a4-c0cc8d4c1dc9?change_time=1762534815","publicationDate":"1762534796"},{"id":"148","title":"LANGAME Challenge Lite","releaseDate":"1761378902","isImportant":true,"description":"«Дворовый» киберспорт вышел на настоящую игровую арену🔥\n\nПервый сезон турнира LANGAME Challenge Lite по CS2 в самом разгаре — сегодня стартует стадия Play-off! \n\nУчастники из 79 копьютерных клубов со всей России покажут всё, на что способны 💪\n\n**Расписание:** \n* 25.10 — 11:00-18:00 \n* 26.10 — 14:00-20:00 \n* 01.11 — 14:00-20:00 \n* 02.11 — 14:00-20:00\n\n👉 Смотрим на канале **[langameru](https://live.vkvideo.ru/langameru)** — будет жарко!","imageUrl":"https://images.live.vkvideo.ru/image/83b3eb71-846b-4960-b696-f180d005aab7?change_time=1761378996","publicationDate":"1761379022"},{"id":"147","title":"Меняем минуты просмотра стримов на минуты облачного гейминга 🔥","releaseDate":"1761124670","isImportant":true,"description":"Каждые 2 часа просмотра стримов в категориях **Warface**, **Мир Танков**, **Counter-Strike 2** и **PUBG**  = 60 минут игрового времени в **VK Play Cloud**! \n\nС 22 по 28 октября забирай боксы с промокодом и запускай игры на слабых ПК, Mac, телефонах и телевизорах!\n\n❗️Боксы можно активировать до 31 октября! \n\nПодробности ищи на странице **[Бокс-Кампаний](https://live.vkvideo.ru/app/box/campaigns)**\n","imageUrl":"https://images.live.vkvideo.ru/image/c80a058e-15bb-4fb4-9fe6-a1d84e9a87c0?change_time=1761124716","publicationDate":"1761124695"},{"id":"145","title":"Встречайте обновления платформы этой недели 🔥","releaseDate":"1756912924","isImportant":true,"description":"\n\n🟣Выбор канала для рестрима \nОбновили интерфейс и добавили возможность рестримить на дополнительные каналы.\n\n🟣Меню сайта\nВнесли визуальное разделение функций — для стримеров и зрителей. \n\n🟣Структура Главной страницы\nВнесли изменения в порядок блоков на Главной странице — если не находите нужное сразу, просто долистайте страницу 🫶\n\n🟣Сервис для донатов\nДобавили в список новый сервис: DonateHelper. \n\nИ конечно — исправили множество неприятных багов! 🙌\n\nДо встречи на стримах 🔴\n","imageUrl":"https://images.live.vkvideo.ru/image/0f0045fd-e491-41b0-9a9d-e1f8b1caa58c?change_time=1756912970","publicationDate":"1756912964"},{"id":"143","title":"Новый алгоритм лампового потока","releaseDate":"1755875104","isImportant":true,"description":"**Обновления этой недели — кто уже заметил?** 😏\n\n🟣**Новый алгоритм лампового потока**\n\nВ поток попадают каналы 1 и 2 уровня Стримерских сезонов вне зависимости от наличия галочки верификации.\n\nВ поток попадают каналы с онлайном меньше или равным 60. \n\nСортировка рандомна при каждом обновлении потока.\n\n🟣**Кнопка с переходом на канал VK Видео**\n\nУ стримеров с привязанным сообществом появилась кнопка с ссылкой на канал VK Видео в студии.\n\n🟣**Управление прогнозами**\n\nТеперь управление аналогично опросам — через троеточие на баннере.","imageUrl":"https://images.live.vkvideo.ru/image/011c7802-fb02-47ba-a4c8-c303297ca591?change_time=1756111804","publicationDate":"1755875116"}],"extra":{"isLast":false,"offset":10}},"fulfilledTimeStamp":1776615774823}},"mutations":{},"provided":{"Recommendations":{"__internal_without_id":["getRecommendedStreams"]}},"subscriptions":{"getRecommendedStreams":{"GlHSfcxbuAxmBbE-Tx-o2":{}},"getActualNews({\"platform\":\"desktop\"})":{"iD8SR3hHbMfJVJCsEHFeb":{}},"desktop":{"unM5alT8afxpSZATKMCaV":{}}},"config":{"online":true,"focused":true,"middlewareRegistered":true,"refetchOnFocus":false,"refetchOnReconnect":false,"refetchOnMountOrArgChange":false,"keepUnusedDataFor":60,"reducerPath":"api"}},"news":{"isOpenNews":false}}</script>
