[package]
name = "rtmp-steganography"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
ctrlc = "3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
reed-solomon-erasure = "6"
crc32fast = "1"
rand_chacha = "0.3"
rand_core = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
kcp = "0.5"
yamux = "0.13"
hdrhistogram = "7"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
rand = "0.8"

[features]
ffmpeg-integration = []

[profile.release]
opt-level = 3
lto = "thin"
